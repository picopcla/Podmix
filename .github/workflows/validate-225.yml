name: validate-225
on:
  push:
    branches: [test/validate-225-d]
permissions:
  contents: read
jobs:
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90ca200fb981d6e430c5eee50f9d4666f5c4ec76
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Android unit tests
        id: aut
        continue-on-error: true
        run: cd android && ./gradlew testNgReleaseUnitTest --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-225-android-unit
          path: android/app/build/reports/tests
          if-no-files-found: ignore
      - name: Resume
        if: always()
        run: |
          echo "- android unit tests: ${{ steps.aut.outcome }}" >> $GITHUB_STEP_SUMMARY
  android-instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90ca200fb981d6e430c5eee50f9d4666f5c4ec76
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Preparer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        id: inst
        continue-on-error: true
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            mkdir -p artifacts
            adb logcat -c
            (cd android && ./gradlew connectedNgDebugAndroidTest --continue) || echo INST_FAILED
            adb logcat -d > artifacts/logcat.txt || true
            adb exec-out screencap -p > artifacts/final.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-225-instrumented
          path: |
            artifacts
            android/app/build/reports/androidTests
          if-no-files-found: ignore
      - name: Resume
        if: always()
        run: |
          echo "- instrumented (lecture Media3, Android Auto): ${{ steps.inst.outcome }}" >> $GITHUB_STEP_SUMMARY
