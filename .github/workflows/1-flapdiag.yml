name: flap-diag

on:
  push:
    branches: [test/flap-diag-20261024]
  workflow_dispatch:

concurrency:
  group: podmix-flap-diag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Appliquer l instrumentation de diagnostic (observation pure)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf %s '' | base64 -d > /tmp/flap-diag-patch.py
          python3 /tmp/flap-diag-patch.py
          git add src/App.tsx
          if ! git diff --cached --quiet; then
            git commit -m "diag: instrumentation FLAPDIAG observation pure + tracklist de test"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Preparer la signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            test -n "${!value}"
          done
          umask 077
          printf '%s' "$KS_B64" | base64 -d > android/podmix-release.keystore
          printf 'storeFile=podmix-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/release-signing.properties
      - run: npm ci
      - name: Construire l APK ng release instrumente
        run: npm run android:build:ng
      - name: Verifier et collecter l APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/ng/release/app-ng-release.apk out/app-ng-release.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging out/app-ng-release.apk | head -1)
          printf '%s\n' "$BADGING"
          grep -Fq "name='com.podmix.next.ng'" <<<"$BADGING"
          "$BT/apksigner" verify out/app-ng-release.apk
          sha256sum out/app-ng-release.apk > out/app-ng-release.apk.sha256
      - name: Retirer le materiel de signature
        if: always()
        run: rm -f android/podmix-release.keystore android/release-signing.properties
      - uses: actions/upload-artifact@v4
        with:
          name: flapdiag-apk
          path: |
            out/app-ng-release.apk
            out/app-ng-release.apk.sha256
          retention-days: 14

  emulator:
    needs: build
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flapdiag-apk
          path: out
      - name: Preparer l emulateur accelere et ffmpeg
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Preparer le harnais de diagnostic
        run: |
          set -euo pipefail
          printf %s '' | base64 -d > /tmp/flapdiag.mjs
          # Variante hors ligne demandee le 24/10 : le harnais est seul adapte.
          # L instrumentation FLAPDIAG et le code lecteur restent strictement inchanges.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/flapdiag.mjs')
          src = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global src
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'ancre harnais attendue une fois, trouvee {count}: {old[:100]!r}')
              src = src.replace(old, new)

          replace_once(
              "const out = { phases: [], errors: [], diag: [], flapdiag: { counts: {}, seedSeen: false, plays: [], scopeTransitions: [] } }",
              "const out = { phases: [], errors: [], diag: [], network: {}, flapdiag: { counts: {}, seedSeen: false, plays: [], scopeTransitions: [] } }",
          )
          replace_once(
              "const lines = ['# Diagnostic clignotement play/pause (build instrumente FLAPDIAG, observation pure)', '']",
              "const lines = ['# Diagnostic clignotement play/pause HORS LIGNE (build instrumente FLAPDIAG, observation pure)', '']",
          )
          replace_once(
              "  lines.push(`## FLAPDIAG (logcat)`)",
              "  lines.push(`## Reseau`)\n  lines.push(`- mode avion demande: ${out.network.airplaneRequested}, settings airplane_mode_on=${out.network.airplaneSetting}, Wi-Fi=${JSON.stringify(out.network.wifi)}, donnees=${JSON.stringify(out.network.data)}, ping IPv4 rc=${out.network.pingRc}`)\n  lines.push(`## FLAPDIAG (logcat)`)",
          )
          replace_once(
              "function startApp() {\n  const res = sh(`adb shell am start -n ${PKG}/com.podmix.next.MainActivity 2>&1`)\n  logd('am start: ' + res.replace(/\\n/g, ' ; ').slice(0, 200))\n}\n",
              """function startApp() {
            const res = sh(`adb shell am start -n ${PKG}/com.podmix.next.MainActivity 2>&1`)
            logd('am start: ' + res.replace(/\\n/g, ' ; ').slice(0, 200))
          }

          async function cutNetworkAfterImport() {
            const airplaneResult = sh('adb shell cmd connectivity airplane-mode enable').trim()
            sh('adb shell svc wifi disable')
            sh('adb shell svc data disable')
            await sleep(5000)
            out.network = {
              airplaneRequested: airplaneResult || 'commande envoyee',
              airplaneSetting: sh('adb shell settings get global airplane_mode_on').trim(),
              wifi: sh('adb shell cmd wifi status').trim().slice(0, 300),
              data: sh('adb shell dumpsys telephony.registry | grep -m1 -E "mDataConnectionState|mDataNetworkType"').trim().slice(0, 300),
              pingRc: sh("adb shell 'ping -c 1 -W 2 1.1.1 >/dev/null 2>&1; echo $?' ").trim(),
            }
            logd('reseau coupe apres import et telechargement: ' + JSON.stringify(out.network))
            if (out.network.airplaneSetting !== '1' || out.network.pingRc === '0') {
              throw new Error('preuve de mise hors ligne insuffisante: ' + JSON.stringify(out.network))
            }
          }

          async function waitForOfflineDownload(id, timeoutMs) {
            const prefsPath = `/data/user/0/${PKG}/shared_prefs/podmix_downloads.xml`
            const audioPath = `/sdcard/Android/data/${PKG}/files/Podcasts/podmix/${id}.offline`
            const t0 = Date.now()
            let lastPrefs = ''
            let lastBytes = 0
            while (Date.now() - t0 < timeoutMs) {
              lastPrefs = sh(`adb shell cat ${prefsPath}`)
              lastBytes = Number(sh(`adb shell stat -c %s ${audioPath}`).trim()) || 0
              const completed = lastPrefs.includes(`name="${id}.status">completed</string>`)
              if (completed && lastBytes > 1_000_000) {
                logd(`telechargement UI termine avant coupure reseau: id=${id}, octets=${lastBytes}, statut=completed`)
                return lastBytes
              }
              await sleep(2000)
            }
            throw new Error(`telechargement hors ligne non termine: octets=${lastBytes}, prefs=${lastPrefs.replace(/\s+/g, ' ').slice(0, 500)}`)
          }
          """,
          )
          replace_once(
              """  tapNode(carte)
            await sleep(5000)
            let fr = screencapRaw()
          """,
              """  // La WebView release ne publie pas ses boutons internes a uiautomator.
            // Le profil et la resolution de l emulateur sont fixes : ouvrir la vue episode,
            // puis toucher le bouton circulaire de telechargement a droite de sa ligne.
            tapNode(carte)
            await sleep(5000)
            let fr = screencapRaw()
            if (!fr) throw new Error('capture indisponible avant telechargement hors ligne')
            const downloadX = Math.round(fr.w * 0.81)
            const downloadY = Math.round(fr.h * 0.52)
            cap('artifacts/vue-podcast-avant-telechargement.png')
            tap(downloadX, downloadY)
            logd(`tap telechargement a (${downloadX},${downloadY})`)
            await waitForOfflineDownload('repro-ep-1', 180000)
            await sleep(5000)
            logd('episode telecharge par Podmix avant coupure reseau')
            cap('artifacts/episode-disponible-hors-ligne.png')

            // Ecart de conditions principal : toutes les observations ci-dessous sont hors ligne.
            await cutNetworkAfterImport()
            cap('artifacts/vue-podcast-mode-avion-avant-lire.png')

            fr = screencapRaw()
          """,
          )
          replace_once(
              "out.phases.push({ label: 'A-lecture-continue-70s', video: va, ms: msA })",
              "out.phases.push({ label: 'A-mode-avion-lecture-continue-70s', video: va, ms: msA })",
          )
          replace_once(
              "out.phases.push({ label: 'A-lecture-continue-70s', ms: msA, note: 'screenrecord indisponible' })",
              "out.phases.push({ label: 'A-mode-avion-lecture-continue-70s', ms: msA, note: 'screenrecord indisponible' })",
          )
          replace_once(
              "out.phases.push({ label: 'B-apres-pause-reprendre-70s', video: vb, ms: msB })",
              "out.phases.push({ label: 'B-mode-avion-apres-pause-reprendre-70s', video: vb, ms: msB })",
          )
          replace_once(
              "out.phases.push({ label: 'B-apres-pause-reprendre-70s', ms: msB, note: 'screenrecord indisponible' })",
              "out.phases.push({ label: 'B-mode-avion-apres-pause-reprendre-70s', ms: msB, note: 'screenrecord indisponible' })",
          )

          path.write_text(src, encoding='utf-8')
          PY
          node --check /tmp/flapdiag.mjs
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            set -eu
            mkdir -p artifacts
            adb install out/app-ng-release.apk
            adb root || true
            sleep 2
            node /tmp/flapdiag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flapdiag-artifacts
          path: artifacts/
          retention-days: 14
