name: flap-diag

on:
  push:
    branches: [test/flap-diag-20261024]
  workflow_dispatch:

concurrency:
  group: podmix-flap-diag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Appliquer l instrumentation de diagnostic (observation pure)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf %s '' | base64 -d > /tmp/flap-diag-patch.py
          python3 /tmp/flap-diag-patch.py
          git add src/App.tsx
          if ! git diff --cached --quiet; then
            git commit -m "diag: instrumentation FLAPDIAG observation pure + tracklist de test"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Preparer la signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            test -n "${!value}"
          done
          umask 077
          printf '%s' "$KS_B64" | base64 -d > android/podmix-release.keystore
          printf 'storeFile=podmix-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/release-signing.properties
      - run: npm ci
      - name: Construire l APK ng release instrumente
        run: npm run android:build:ng
      - name: Verifier et collecter l APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/ng/release/app-ng-release.apk out/app-ng-release.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging out/app-ng-release.apk | head -1)
          printf '%s\n' "$BADGING"
          grep -Fq "name='com.podmix.next.ng'" <<<"$BADGING"
          "$BT/apksigner" verify out/app-ng-release.apk
          sha256sum out/app-ng-release.apk > out/app-ng-release.apk.sha256
      - name: Retirer le materiel de signature
        if: always()
        run: rm -f android/podmix-release.keystore android/release-signing.properties
      - uses: actions/upload-artifact@v4
        with:
          name: flapdiag-apk
          path: |
            out/app-ng-release.apk
            out/app-ng-release.apk.sha256
          retention-days: 14

  emulator:
    needs: build
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flapdiag-apk
          path: out
      - name: Preparer l emulateur accelere et ffmpeg
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Preparer le harnais de diagnostic
        run: |
          set -euo pipefail
          printf %s '' | base64 -d > /tmp/flapdiag.mjs
          node --check /tmp/flapdiag.mjs
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            set -eu
            mkdir -p artifacts
            adb install out/app-ng-release.apk
            adb root || true
            sleep 2
            node /tmp/flapdiag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flapdiag-artifacts
          path: artifacts/
          retention-days: 14
