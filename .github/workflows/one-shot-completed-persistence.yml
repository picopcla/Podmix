name: one-shot-completed-persistence
on:
  push:
    branches: [fix/231-update-nag-and-home-grid]
    paths: [.github/workflows/one-shot-completed-persistence.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'picopcla/Podmix' && github.ref == 'refs/heads/fix/231-update-nag-and-home-grid'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact three-file completed episode persistence patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = picopcla/Podmix
          test "$GITHUB_REF" = refs/heads/fix/231-update-nag-and-home-grid
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = a130a7c1f0230260f83dcc668cbd05f186a9447a
          cat <<'PATCH' | base64 -d > /tmp/completed.patch
          
          PATCH
          echo 'c29826683aa8a2ac5b4940acef10308bf39dedcc226808505a3a37cd53d6b7bf  /tmp/completed.patch' | sha256sum -c -
          git apply --check /tmp/completed.patch
          git apply /tmp/completed.patch
          sha256sum -c <<'HASHES'
          03c516cc23e9c3274a7bcb0088c5f0931e9fadbcec87b494ff2d1e1738e94835  src/App.tsx
          068dfddb99dde5c4b428550b1ddaa54274ff02581e3db572846bc6008a44a68e  src/completedEpisodeStorage.ts
          d15876f048912d6713110f642dcc5541a115a991f71037717ebbe855209ee6b2  tests/unit/completedEpisodeStorage.test.ts
          HASHES
          npm ci
          npm run test:unit
          npx vitest run tests/unit/completedEpisodeStorage.test.ts tests/unit/catalogRetention.test.ts tests/unit/lan-relay.test.ts tests/unit/lan-relay-api.test.ts
          npm run build
          git add -- src/App.tsx src/completedEpisodeStorage.ts tests/unit/completedEpisodeStorage.test.ts
          printf '%s\n' src/App.tsx src/completedEpisodeStorage.ts tests/unit/completedEpisodeStorage.test.ts | sort > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff /tmp/expected-files /tmp/actual-files
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist completed episodes in verified IndexedDB without removing legacy data'
          git push origin HEAD:refs/heads/fix/231-update-nag-and-home-grid
          git rev-parse HEAD
