name: repro-playpause-flap

on:
  push:
    branches: [test/playpause-flap-repro]
  workflow_dispatch:

concurrency:
  group: podmix-flap-repro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Recuperer l'APK 1.0.222 livre a Emmanuel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out /home/runner/repro
          gh release download v1.0.222-ng-badges -R ${{ github.repository }} -p app-ng-release.apk -O out/app-ng-release.apk --clobber
          ls -l out/
      - name: Preparer le script de reproduction (CDP WebView)
        run: |
          set -euo pipefail
          cd /home/runner/repro
          npm init -y >/dev/null
          npm install playwright-core@1.49.1 >/dev/null
          echo '' | base64 -d > repro.mjs
          node --check repro.mjs && echo "repro.mjs syntaxe OK"
      - name: Preparer l'emulateur accelere
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            set -u
            adb install out/app-ng-release.apk
            adb shell pm grant com.podmix.next.ng android.permission.POST_NOTIFICATIONS || true
            cd /home/runner/repro && node repro.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podmix-flap-repro
          path: /home/runner/repro/artifacts/
          retention-days: 14
