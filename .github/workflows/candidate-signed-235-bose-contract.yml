      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash /tmp/release-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed235-completed-release-qa-evidence
          path: /tmp/qa-out
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: podmix235-full-persistence-candidate-signed-apk
          path: |
            out/app-ng-candidate-signed.apk
            out/app-ng-candidate-signed.apk.sha256
          retention-days: 14
