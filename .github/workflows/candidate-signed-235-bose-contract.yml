          python3 /tmp/qa-completed-seed.py seed
          adb shell svc wifi disable
          adb shell svc data disable
          adb install -r out/published231.apk
          adb shell dumpsys package com.podmix.next.ng | grep -E 'versionCode=|versionName=' | tee /tmp/qa-out/baseline-package.txt
          grep -q versionCode=10231 /tmp/qa-out/baseline-package.txt
          adb pull /data/data/com.podmix.next.ng /tmp/release-before
          python3 qa-read-release-storage.py /tmp/release-before /tmp/qa-out/release230-local.json
          adb shell sha256sum /sdcard/Android/data/com.podmix.next.ng/files/Podcasts/podmix/qa-download.offline > /tmp/qa-out/release-download-before.sha256
          # Establish a real 232 baseline before upgrading to 233. No uninstall/clear.
          adb install -r out/published232.apk
          adb shell am start -n com.podmix.next.ng/com.podmix.next.MainActivity
          sleep 15
          adb shell am force-stop com.podmix.next.ng
          adb shell dumpsys package com.podmix.next.ng | grep -E 'versionCode=|versionName=' | tee /tmp/qa-out/published232-package.txt
          grep -q versionCode=10232 /tmp/qa-out/published232-package.txt
          adb pull /data/data/com.podmix.next.ng /tmp/published232-before-upgrade
          adb install -r out/published233.apk
          adb shell am start -n com.podmix.next.ng/com.podmix.next.MainActivity
          sleep 12
          adb shell am force-stop com.podmix.next.ng
          adb shell dumpsys package com.podmix.next.ng | grep -E 'versionCode=|versionName=' | tee /tmp/qa-out/published233-package.txt
          grep -q versionCode=10233 /tmp/qa-out/published233-package.txt
