          adb shell am force-stop com.podmix.next.ng
          adb shell am start -n com.podmix.next.ng/com.podmix.next.MainActivity
          sleep 10
          adb shell am force-stop com.podmix.next.ng
          adb pull /data/data/com.podmix.next.ng /tmp/release-after
          python3 /tmp/qa-release-completed.py /tmp/release-after /tmp/qa-out/release235-local.json /tmp/qa-out/release230-local.json
          adb shell sha256sum /sdcard/Android/data/com.podmix.next.ng/files/Podcasts/podmix/qa-download.offline > /tmp/qa-out/release-download-after.sha256
          diff /tmp/qa-out/release-download-before.sha256 /tmp/qa-out/release-download-after.sha256
          echo 'RELEASE_QA PASS published233 to exact non-debuggable production candidate235, no wipe/uninstall, physical download unchanged'
          # Same signed source/web/version, debug-only inspection twin. Installed only AFTER exact release235 restart.
          adb install -r out/app-ng-verification-twin.apk
          adb shell am start -n com.podmix.next.ng/com.podmix.next.MainActivity
          sleep 10
          python3 /tmp/qa-completed-seed.py verify
          adb shell sha256sum /sdcard/Android/data/com.podmix.next.ng/files/Podcasts/podmix/qa-download.offline > /tmp/qa-out/twin-download-after.sha256
          diff /tmp/qa-out/release-download-before.sha256 /tmp/qa-out/twin-download-after.sha256
