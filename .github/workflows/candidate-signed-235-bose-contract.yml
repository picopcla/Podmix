          grep -q versionCode=10235 /tmp/qa-out/release235-package.txt
          adb shell pidof com.podmix.next.ng
          adb shell uiautomator dump /sdcard/qa-ui.xml
          adb pull /sdcard/qa-ui.xml /tmp/qa-out/release235-ui.xml
          adb exec-out screencap -p > /tmp/qa-out/release235-launch.png
          python3 - <<'SCREEN'
          import base64
          s=base64.b64encode(open('/tmp/qa-out/release235-launch.png','rb').read()).decode()
          for i in range(0,len(s),1900):print('RELEASEPNG '+s[i:i+1900],flush=True)
