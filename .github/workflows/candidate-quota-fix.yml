          +  safeSetItem(LISTENING_SESSIONS_KEY, JSON.stringify(sessions.slice(0, 2_000)))
           }

           export function searchListeningSessions(sessions: ListeningSession[], query: string) {
          diff --git a/src/nativePlayer.ts b/src/nativePlayer.ts
          index 2a8bff1..1a43cd1 100644
          --- a/src/nativePlayer.ts
          +++ b/src/nativePlayer.ts
          @@ -1,6 +1,7 @@
           import { Capacitor, registerPlugin } from '@capacitor/core'
           import type { PluginListenerHandle } from '@capacitor/core'
           import { decodeCredits } from './credits'
          +import { safeSetItem } from './safeStorage'

           export type PlayerState = {
             playing: boolean
          @@ -318,7 +319,7 @@ export const podmixPlayer = {
               const volume = Math.max(0, Math.min(1, options.volume))
               if (Capacitor.isNativePlatform()) return NativePlayer.setVolume({ volume })
               webAudio.volume = volume
          -    localStorage.setItem('podmix-player-volume', String(volume))
          +    safeSetItem('podmix-player-volume', String(volume))
               return { volume }
             },
             async getVolume() {
          diff --git a/src/safeStorage.ts b/src/safeStorage.ts
          new file mode 100644
          index 0000000..87c9e40
          --- /dev/null
          +++ b/src/safeStorage.ts
          @@ -0,0 +1,20 @@
          +/**
          + * Ecriture localStorage qui ne casse pas l'interface quand le quota est atteint.
          + * Aucune donnee existante n'est supprimee : si l'espace manque, l'ecriture
          + * demandee est simplement ignoree (l'etat reste en memoire dans l'application).
          + */
          +let quotaWarned = false
          +
          +export function safeSetItem(key: string, value: string): void {
          +  try {
          +    localStorage.setItem(key, value)
          +  } catch (error) {
          +    const quota = error instanceof DOMException
          +      && (error.name === 'QuotaExceededError' || error.name === 'NS_ERROR_DOM_QUOTA_REACHED' || error.code === 22)
          +    if (!quota) throw error
          +    if (!quotaWarned) {
          +      quotaWarned = true
          +      console.warn(`Stockage local plein : ecriture ignoree (${key}), aucune donnee supprimee.`)
          +    }
          +  }
          +}
          diff --git a/src/storage.ts b/src/storage.ts
          index 3779e8a..7e247eb 100644
          --- a/src/storage.ts
          +++ b/src/storage.ts
          @@ -1,4 +1,5 @@
           import type { CatalogSource, OfflineEpisode, Track } from './domain'
          +import { safeSetItem } from './safeStorage'

           const DATABASE = 'podmix-studio'
