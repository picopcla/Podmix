          -  localStorage.setItem(COMPLETED_EPISODES_KEY, JSON.stringify([...new Set(ids)].slice(0, 2_000)))
          +  safeSetItem(COMPLETED_EPISODES_KEY, JSON.stringify([...new Set(ids)].slice(0, 2_000)))
           }

