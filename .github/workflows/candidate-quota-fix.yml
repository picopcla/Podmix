          -  localStorage.setItem(OFFLINE_KEY, JSON.stringify(episodes))
          +  safeSetItem(OFFLINE_KEY, JSON.stringify(episodes))
           }

          PATCHEOF
          git apply --index /tmp/quota.patch
          git diff --cached --stat
      - name: Verifier typage, lint, tests unitaires et build
        run: |
          set -eu
          npx tsc -b
          npx oxlint
          npm run build > /tmp/build-fix.txt 2>&1 || { tail -20 /tmp/build-fix.txt; exit 1; }
          rm -rf /tmp/dist-fix && cp -r dist /tmp/dist-fix
          if grep -q '"test:unit"' package.json; then npm run test:unit 2>&1 | tail -15; fi
      - name: Meme scenario de saturation avec le correctif
        run: |
          node qt/repro.mjs /tmp/dist-fix fixed > /tmp/repro-fixed.txt 2>&1 || true
          cat /tmp/repro-fixed.txt
          {
            echo "## Saturation du stockage local (contexte de test jetable, aucune donnee utilisateur)"
            echo '### Base'
            echo '```'; cut -c1-400 /tmp/repro-base.txt; echo '```'
            echo '### Avec correctif'
            echo '```'; cut -c1-400 /tmp/repro-fixed.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q 'QuotaExceededError' /tmp/repro-base.txt
          ! grep -q 'QuotaExceededError' /tmp/repro-fixed.txt
          grep -q 'donnees utilisateur preservees: true' /tmp/repro-fixed.txt
      - name: Pousser le correctif sur une nouvelle branche (jamais main, aucune publication)
        run: |
          set -eu
          git config user.name "picopcla"
          git config user.email "picopcla@users.noreply.github.com"
          git checkout -b fix/localstorage-quota-20261026
          git commit -m "Ne plus casser l'interface quand le stockage local est plein (ecriture ignoree, aucune suppression)"
          git push origin fix/localstorage-quota-20261026
          echo "branche fix/localstorage-quota-20261026 poussee: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
