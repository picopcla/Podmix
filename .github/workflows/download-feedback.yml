name: download-feedback

on:
  push:
    branches: [fix/download-feedback-20261013]
  workflow_dispatch:
    inputs:
      publish:
        description: Publier la préversion après validation complète
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer la signature existante
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            test -n "${!value}"
          done
          umask 077
          printf '%s' "$KS_B64" | base64 -d > android/podmix-release.keystore
          printf 'storeFile=podmix-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/release-signing.properties
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install chromium
      - name: Tests ciblés du téléchargement et des entités HTML
        run: npx playwright test --project=mobile-chromium --grep "entités HTML|confirme immédiatement"
      - name: Construire les APK Android
        run: |
          npm run android:build:ng
          cd android
          ./gradlew testNgDebugUnitTest assembleNgDebug
      - name: Vérifier et collecter les APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/ng/release/app-ng-release.apk out/app-ng-release.apk
          cp android/app/build/outputs/apk/ng/debug/app-ng-debug.apk out/app-ng-debug.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          BADGING=$("$BT/aapt" dump badging out/app-ng-release.apk | head -1)
          printf '%s\n' "$BADGING"
          grep -Fq "name='com.podmix.next.ng'" <<<"$BADGING"
          grep -Fq "versionCode='10218'" <<<"$BADGING"
          grep -Fq "versionName='1.0.218-ng'" <<<"$BADGING"
          "$BT/apksigner" verify out/app-ng-release.apk
          CERT_DIGEST=$("$BT/apksigner" verify --print-certs out/app-ng-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          printf 'Certificat SHA-256 public: %s\n' "$CERT_DIGEST"
          test "$CERT_DIGEST" = b27d46c092c63432e7e274d227c0e465cf91ab4656f67c1a0b511402505c8b8c
          DEBUG_CERT_DIGEST=$("$BT/apksigner" verify --print-certs out/app-ng-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          test "$DEBUG_CERT_DIGEST" = "$CERT_DIGEST"
          sha256sum out/app-ng-release.apk > out/app-ng-release.apk.sha256
      - name: Retirer le matériel de signature
        if: always()
        run: rm -f android/podmix-release.keystore android/release-signing.properties
      - uses: actions/upload-artifact@v4
        with:
          name: podmix-html-entities-apks
          path: |
            out/app-ng-release.apk
            out/app-ng-debug.apk
            out/app-ng-release.apk.sha256
          retention-days: 14

  emulator:
    needs: build-test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: podmix-html-entities-apks
          path: out
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: sh scripts/run-download-feedback-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podmix-html-entities-emulator
          path: artifacts/emulator-captures/
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build-test, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: podmix-html-entities-apks
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: podmix-html-entities-emulator
          path: captures
      - name: Publier la préversion 1.0.218-ng
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.218-ng-html-entities out/app-ng-release.apk out/app-ng-release.apk.sha256 captures/*.png \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Podmix 1.0.218-ng — textes propres et téléchargement clair" \
            --notes "Les artistes, titres, épisodes et tracklists affichent correctement les esperluettes, y compris après un double encodage. Le bouton de téléchargement confirme immédiatement la demande, suit progression/erreur/réessai, puis devient une coche Téléchargé avec corbeille séparée. Les contrôles ont été exécutés avec des données factices."
