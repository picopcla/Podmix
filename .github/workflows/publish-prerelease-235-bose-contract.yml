name: publish-prerelease-235-bose-contract

on:
  workflow_dispatch:
  push:
    branches: [fix/231-update-nag-and-home-grid]
    paths: ['.github/workflows/publish-prerelease-235-bose-contract.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-prerelease-235-bose-contract
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.235-ng-bose-contract
      SRC_RUN: '43563815762'
      SRC_SHA: 0e1a0bc4e9627e784bc06f74e8db2a5a9a5bd9c6
      EXPECT_SHA256: f206c3444c7651da9e414d4bda88416dec3b09b5315f1e6cddd56c495d751494
    steps:
      - name: Telecharger l'APK deja teste (run 43563815762)
        run: |
          set -euo pipefail
          mkdir -p out
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$SRC_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$SRC_RUN" --jq '.head_sha')" = "$SRC_SHA"
          gh run download "$SRC_RUN" -R "${{ github.repository }}" -n podmix235-full-persistence-candidate-signed-apk -D out
          ls -l out
      - name: Verifier empreinte, identite et certificat
        run: |
          set -euo pipefail
          GOT=$(sha256sum out/app-ng-candidate-signed.apk | cut -d' ' -f1)
          echo "sha256: $GOT"
          test "$GOT" = "$EXPECT_SHA256"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/aapt2" dump badging out/app-ng-candidate-signed.apk > out/badging.txt
          if grep -q application-debuggable out/badging.txt; then exit 1; fi
          BADGING=$("$BT/aapt2" dump badging out/app-ng-candidate-signed.apk | sed -n '1p')
          echo "$BADGING"
          grep -Fq "name='com.podmix.next.ng'" <<<"$BADGING"
          grep -Fq "versionCode='10235'" <<<"$BADGING"
          grep -Fq "versionName='1.0.235-ng'" <<<"$BADGING"
          "$BT/apksigner" verify out/app-ng-candidate-signed.apk
          CERT=$("$BT/apksigner" verify --print-certs out/app-ng-candidate-signed.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          echo "cert: $CERT"
          test "$CERT" = "b27d46c092c63432e7e274d227c0e465cf91ab4656f67c1a0b511402505c8b8c"
      - name: Publier la pre-release (nouveau tag, rien d'existant modifie)
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "${{ github.repository }}" > out/existing-release.txt 2>&1; then
            echo "release $TAG existe deja: arret, aucune ecriture"; exit 1
          fi
          cp out/app-ng-candidate-signed.apk out/app-ng-release.apk
          cat > out/release-notes.txt <<'NOTES'
          Podmix 1.0.235-ng
          - Bose SoundTouch : découverte du service de lecture annoncé par l'enceinte et respect de ses commandes.
          - Vérification du flux réellement lancé avant d'afficher une lecture confirmée ; erreurs de relais HTTP signalées clairement.
          - Mise à jour depuis la 233 sans désinstallation. Conservation des données vérifiée sur une bibliothèque de test de 105 épisodes.
          Le parcours Bose est validé en simulation Android. La lecture audio sur votre SoundTouch 30 physique reste à confirmer.
          NOTES
          gh release create "$TAG" out/app-ng-release.apk --prerelease -R "${{ github.repository }}" --target "$SRC_SHA" \
            --title "Podmix 1.0.235-ng - version de test Bose SoundTouch" \
            --notes-file out/release-notes.txt
          {
            echo "## Pre-release publiee: $TAG"
            echo "- sha256 asset: $EXPECT_SHA256"
            echo "- commit source: $SRC_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
