name: Android debug APK

on:
  push:
    branches: [fix/resume-position-id-normalize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:build:debug
      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: podmix-debug-apk
          path: out/*.apk
