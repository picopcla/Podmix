name: one-shot-full-persistence
on:
  push:
    branches: [fix/231-update-nag-and-home-grid]
    paths: [.github/workflows/one-shot-full-persistence.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'picopcla/Podmix' && github.ref == 'refs/heads/fix/231-update-nag-and-home-grid'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate exact six tested persistence files on test branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = picopcla/Podmix
          test "$GITHUB_REF" = refs/heads/fix/231-update-nag-and-home-grid
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 2538baddde73f108c071c31ec1f512e3d6a4eb12
          cat <<'PATCH' | base64 -d > /tmp/full-storage.patch
          
          PATCH
          echo '6573d451957e03c3d5aef42764aabd228ea7d5860071d0181892284adae2354d  /tmp/full-storage.patch' | sha256sum -c -
          git apply --check /tmp/full-storage.patch
          git apply /tmp/full-storage.patch
          sha256sum -c <<'HASHES'
          c1800a12c63eaa00cc6d7f1acadd8602b8dffec5de32e5d29e25c493e9de4e35  src/App.tsx
          fe615781d20bdaf8767a9d421b58ca8b92341688e0f75819cdb0f9f4cd98485a  src/history.ts
          d2977ae2947233330d334a7582cfa083149ad9263fa50e15b7e113c38fa70f15  src/main.tsx
          ef545a38afb3c3bf7bec22f367156de2e83c390f786ad5e27ed2505374136eb1  src/storage.ts
          2dff3dbb84fff336f7e926353c9a5dc7b7694fb9012bf2c232187f85d00d78d6  src/durableStorage.ts
          bc81fa2e0d6c90465a1af7b33c91cacd9f946aee826b6fca12709ec24e9153d4  tests/unit/durableStorage.test.ts
          HASHES
          npm ci
          npm run test:unit
          npx vitest run tests/unit/durableStorage.test.ts tests/unit/completedEpisodeStorage.test.ts tests/unit/catalogRetention.test.ts tests/unit/lan-relay.test.ts tests/unit/lan-relay-api.test.ts
          npm run build
          git add -- src/App.tsx src/history.ts src/main.tsx src/storage.ts src/durableStorage.ts tests/unit/durableStorage.test.ts
          printf '%s\n' src/App.tsx src/history.ts src/main.tsx src/storage.ts src/durableStorage.ts tests/unit/durableStorage.test.ts | sort > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          diff /tmp/expected-files /tmp/actual-files
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist library history and download metadata without removing legacy copies'
          git push origin HEAD:refs/heads/fix/231-update-nag-and-home-grid
          git rev-parse HEAD
