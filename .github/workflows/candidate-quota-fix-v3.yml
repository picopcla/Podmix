name: candidate-quota-fix-v3

on:
  workflow_dispatch:
  push:
    branches: [fix/studio-playbutton-intent-20261025]
    paths: ['.github/workflows/candidate-quota-fix-v3.yml']

permissions:
  contents: write

jobs:
  v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/localstorage-quota-20261026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Appliquer le correctif v3 (catalogue complet conserve, adresse serveur coherente)
        run: |
          set -eu
          echo '' | base64 -d | gunzip > /tmp/v2.patch
          git apply --index /tmp/v2.patch
          git diff --cached --stat
      - run: npx tsc -b && npx oxlint && npm run test:unit
      - run: npm run build
      - name: Saturation (contexte jetable)
        run: |
          set -o pipefail
          node qt/repro.mjs "$PWD/dist" corrige 2>&1 | tee /tmp/out.txt
          { echo "## v2 saturation"; echo '```'; cat /tmp/out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "preservees: true" /tmp/out.txt
          grep -q "bandeau: Stockage interne plein" /tmp/out.txt
          ! grep -q "QuotaExceededError" /tmp/out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-saturation
          path: qt/*.png
      - name: Pousser sur la branche du correctif (jamais main, aucune publication)
        run: |
          set -eu
          git config user.name "picopcla"
          git config user.email "picopcla@users.noreply.github.com"
          git commit -m "Ne plus ecraser le catalogue complet par un repli reduit et ne pas annoncer une adresse serveur non enregistree"
          git push origin fix/localstorage-quota-20261026
          echo "branche fix/localstorage-quota-20261026: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
