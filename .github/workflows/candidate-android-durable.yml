name: candidate-android-durable

on:
  workflow_dispatch:
  push:
    branches: [fix/durable-storage-20261026]
    paths: ['.github/workflows/candidate-android-durable.yml']

permissions:
  contents: read

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - name: e2e Playwright (information, non bloquant)
        continue-on-error: true
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --reporter=list 2>&1 | tee e2e.txt || true
          { echo "## e2e Playwright, NOUVEAU code (resume)"; echo '```'; grep -E "^\s+(✓|✘|-)|passed|failed" e2e.txt | cut -c1-170; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  e2e-baseline-228:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 867f490ad2267fc723a7dad29662b75efb14f87e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: e2e Playwright sur l'ANCIEN code 228 (reference, non bloquant)
        continue-on-error: true
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --reporter=list 2>&1 | tee e2e.txt || true
          { echo "## e2e Playwright, ANCIEN code 228 (reference)"; echo '```'; grep -E "^\s+(✓|✘|-)|passed|failed" e2e.txt | cut -c1-170; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  android-durable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - name: Construire les deux APK debug (ancien code 228 = 867f490, et nouveau code), meme signature debug, aucune publication
        env:
          VITE_API_URL: http://10.0.2.2:8099
        run: |
          set -euo pipefail
          mkdir -p out
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='1.0.229';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm run version:sync
          npm run build
          npx cap sync android
          (cd android && ./gradlew assembleNgDebug)
          cp android/app/build/outputs/apk/ng/debug/*.apk out/new.apk
          git checkout -- .
          git worktree add ../old 867f490ad2267fc723a7dad29662b75efb14f87e
          cd ../old
          npm ci --no-audit --no-fund
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='1.0.228';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm run version:sync
          npm run build
          npx cap sync android
          (cd android && ./gradlew assembleNgDebug)
          cp android/app/build/outputs/apk/ng/debug/*.apk "$GITHUB_WORKSPACE/out/old.apk"
      - name: Ecrire le test
        run: |
          mkdir -p out
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/aapt2" dump badging out/new.apk | head -1 | tee out/badging.txt
          sed -n "s/.*package: name='\([^']*\)'.*/\1/p" out/badging.txt > out/pkg.txt
          cat > "$RUNNER_TEMP/p.mjs" <<'PEOF'
          import { execSync } from 'node:child_process'
          const phase = process.argv[2]
          const fs = await import('node:fs')
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
          const targets = await (await fetch('http://127.0.0.1:9222/json')).json()
          const page = targets.find((t) => t.type === 'page')
          const ws = new WebSocket(page.webSocketDebuggerUrl)
          await new Promise((r) => (ws.onopen = r))
          let id = 0
          const pending = new Map()
          ws.onmessage = (m) => { const d = JSON.parse(m.data); if (d.id && pending.has(d.id)) { pending.get(d.id)(d); pending.delete(d.id) } }
          const send = (method, params = {}) => new Promise((res) => { const i = ++id; pending.set(i, res); ws.send(JSON.stringify({ id: i, method, params })) })
          const ev = async (expr) => { const r = await send('Runtime.evaluate', { expression: expr, returnByValue: true, awaitPromise: true }); return r.result?.result?.value ?? JSON.stringify(r.result?.exceptionDetails ?? r.error ?? null).slice(0, 300) }
          const log = (...a) => console.log(...a)
          const IDB = `window.__idbGet = (k) => new Promise((res) => { const o = indexedDB.open('podmix-kv'); o.onerror = () => res(null); o.onsuccess = () => { const g = o.result.transaction('kv').objectStore('kv').get(k); g.onsuccess = () => { o.result.close(); res(g.result ?? null) }; g.onerror = () => res(null) } }); 1`
          await send('Runtime.enable'); await send('Page.enable')
          await ev(IDB)
          const HIST = JSON.stringify([{ id: 'h1', title: 'Episode historique test', artist: 'Artiste test', url: 'https://example.invalid/h1.mp3', position: 42, duration: 3600, playedAt: '2026-10-20T10:00:00.000Z' }])
          const UIHIST = `(async () => { const b = document.querySelector('button[aria-label="Voir l’historique"]'); if (!b) return 'NAV-INTROUVABLE'; b.click(); await new Promise((r) => setTimeout(r, 2500)); const t = [...document.querySelectorAll('.history-item')].map((x) => x.innerText).join(' | '); const back = document.querySelector('button[aria-label="Voir l’historique"]'); if (back) back.click(); return t.includes('Episode historique test') ? 'HISTORIQUE-VISIBLE' : 'HISTORIQUE-ABSENT items=' + t.slice(0, 120) })()`
          const CAT = JSON.stringify([{ id: 'source-favoris', kind: 'podcast', title: 'Podcast des favoris', description: 'Source de test', artworkUrl: '', episodes: [{ id: 'episode-favori-a', title: 'Premier episode favori', description: '', publishedAt: '2026-07-28', duration: '00:02', audioUrl: 'https://example.invalid/fa.wav', sourceUrl: 'https://example.invalid/ea', artworkUrl: '', tracks: [{ id: 1, time: 0.25, artist: 'Artiste A', title: 'Favori du premier episode', artworkUrl: '', deezerUrl: 'https://www.deezer.com/track/123', youtubeUrl: 'https://www.youtube.com/watch?v=detected-a', confidence: 100, source: 'manual' }, { id: 7, time: 0.5, artist: 'Daft Punk', title: 'One More Time', artworkUrl: '', confidence: 100, source: 'manual' }] }, { id: 'episode-favori-b', title: 'Second episode favori', description: '', publishedAt: '2026-07-28', duration: '00:02', audioUrl: 'https://example.invalid/fb.wav', sourceUrl: 'https://example.invalid/eb', artworkUrl: '', tracks: [{ id: 2, time: 0.25, artist: 'Artiste A', title: 'Favori du second episode', artworkUrl: '', spotifyUrl: 'https://open.spotify.com/track/abc', confidence: 100, source: 'manual' }] }] }])
          const FAVS = '["episode-favori-a::track::1::0","episode-favori-b::track::2::0"]'
          const UIFAV = `(async () => { const b = document.querySelector('button[aria-label="Voir les favoris"]'); if (!b) return 'NAV-FAVORIS-INTROUVABLE'; b.click(); await new Promise((r) => setTimeout(r, 2500)); const f = document.querySelector('.favorite-tracks'); const t = f ? f.innerText : ''; const yt = f ? [...f.querySelectorAll('a[aria-label="YouTube disponible : ouvrir le morceau"]')].map((a) => a.getAttribute('href')) : []; const ytKo = f ? f.querySelectorAll('button[aria-label="YouTube indisponible pour ce morceau"]').length : -1; const back = document.querySelector('button[aria-label="Voir les favoris"]'); if (back) back.click(); const dbg = ' brut=' + String(localStorage.getItem('podmix-track-favorites-v1')).slice(0, 80) + ' vue=' + (document.querySelector('.favorites-view') ? document.querySelector('.favorites-view').innerText.slice(0, 80) : 'ABSENTE'); return dbg + (t.includes('Favori du premier episode') ? 'FAVORIS-VISIBLES' : 'FAVORIS-ABSENTS texte=' + t.slice(0, 80)) + ' youtube_liens=' + JSON.stringify(yt) + ' youtube_indisponibles=' + ytKo })()`
          if (phase === 'seed') {
            await ev(`localStorage.setItem('podmix-catalog-v1', ${JSON.stringify(CAT)}); localStorage.setItem('podmix-history-v1', ${JSON.stringify(HIST)}); localStorage.setItem('podmix-track-favorites-v1', ${JSON.stringify(FAVS)}); 1`)
            const fill = await ev(`(() => { let n = 0; for (const size of [10000, 1000, 100, 10, 1]) { try { for (;;) { localStorage.setItem('zz-filler-' + n, 'x'.repeat(size)); n++ } } catch {} } let u = 0; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); u += k.length + (localStorage.getItem(k) ?? '').length } return u })()`)
            log('seed (ancienne version installee): localStorage sature, caracteres utilises', fill)
          }
          if (phase === 'favadd') {
            // parcours reel dans l'UI de l'ANCIENNE version : ouvrir l'episode et ajouter le morceau aux favoris
            log('favadd:', await ev(`(async () => { const sleep = (ms) => new Promise((r) => setTimeout(r, ms)); const pick = (sel, txt) => [...document.querySelectorAll(sel)].filter((x) => x.innerText && x.innerText.includes(txt)).sort((p, q) => p.innerText.length - q.innerText.length)[0]; const s1 = pick('button, article, a', 'Podcast des favoris'); if (!s1) return 'SOURCE-INTROUVABLE texte=' + document.body.innerText.slice(0, 120).replace(/\\s+/g, ' '); s1.click(); await sleep(2000); const e1 = pick('button, article, a', 'Premier episode favori'); if (!e1) return 'EPISODE-INTROUVABLE texte=' + document.body.innerText.slice(0, 160).replace(/\\s+/g, ' '); e1.click(); await sleep(2500); const h = document.querySelector('button[aria-label="Ajouter Favori du premier episode aux favoris"]'); if (!h) return 'COEUR-INTROUVABLE texte=' + document.body.innerText.slice(0, 200).replace(/\\s+/g, ' '); h.click(); await sleep(1500); const h2 = document.querySelector('button[aria-label="Ajouter One More Time aux favoris"]'); if (!h2) return 'COEUR2-INTROUVABLE'; h2.click(); await sleep(2000); return 'FAVORI-AJOUTE' })()`))
          }
          if (phase === 'realyt') {
            // detection YouTube REELLE : serveur candidat local (10.0.2.2:8099), morceau sans lien ; on rafraichit les liens dans l'UI
            await ev(`document.querySelector('button[aria-label="Voir les favoris"]')?.click(); 1`)
            await sleep(2500)
            await ev(`document.querySelector('button[aria-label="Rafraîchir les liens musicaux"]')?.click(); 1`)
            let hrefs = '[]'
            for (let i = 0; i < 30; i += 1) {
              await sleep(3000)
              hrefs = await ev(`JSON.stringify([...document.querySelectorAll('.favorite-tracks a[aria-label="YouTube disponible : ouvrir le morceau"]')].map((a) => a.getAttribute('href')))`)
              if (JSON.parse(hrefs).some((h) => !h.includes('detected-a') && /watch\?v=/.test(h))) break
            }
            fs.writeFileSync('out/yt-href.txt', hrefs)
            log('realyt: liens YouTube dans la vue Favoris:', hrefs)
            log('realyt: texte vue Favoris:', String(await ev(`document.querySelector('.favorite-tracks')?.innerText ?? 'ABSENT'`)).replace(/\s+/g, ' ').slice(0, 300))
            execSync('adb exec-out screencap -p > out/fav-229-yt.png')
          }
          if (phase === 'oldfav') {
            log('oldfav: ecran Favoris:', await ev(UIFAV))
            await ev(`document.querySelector('button[aria-label="Voir les favoris"]')?.click(); 1`)
            await sleep(3000)
            execSync('adb exec-out screencap -p > out/fav-228.png')
            log('oldfav: largeur fenetre', await ev('window.innerWidth + "x" + window.innerHeight + " dpr=" + window.devicePixelRatio'))
          }
          if (phase === 'oldcheck') {
            // precondition : l'ancienne installation a bien conserve ses donnees apres kill/relance
            const snap = JSON.parse(await ev(`JSON.stringify(Object.fromEntries(Object.keys(localStorage).filter((k) => k.startsWith('podmix-')).sort().map((k) => [k, localStorage.getItem(k)])))`))
            fs.writeFileSync('out/before.json', JSON.stringify(snap))
            log('ANCIENNE VERSION apres kill/relance, cles podmix-* :', Object.keys(snap).join(','))
            log('precondition filler persiste:', await ev(`localStorage.getItem('zz-filler-0') !== null`))
            log('precondition catalogue seed persiste:', String(snap['podmix-catalog-v1'] ?? '').includes('Podcast des favoris'))
            log('precondition historique seed persiste:', snap['podmix-history-v1'].includes('Episode historique test'))
            log('precondition historique visible dans l ecran Historique (ancienne version):', await ev(UIHIST))
            log('precondition favoris ancienne version:', await ev(UIFAV))
            const body = String(await ev(`document.body.innerText.slice(0, 200).replace(/\\s+/g, ' ')`))
            log('texte ancienne version:', body)
          }
          if (phase === 'migrated' || phase === 'after') {
            const before = JSON.parse(fs.readFileSync('out/before.json', 'utf8'))
            let same = 0, diff = [], kept = []
            if (phase === 'after') before['podmix-settings-v1'] = fs.readFileSync('out/settings-after.txt', 'utf8')
            for (const k of Object.keys(before)) {
              const r = await ev(`(async () => { const e = await window.__idbGet(${JSON.stringify(k)}); if (!e) return 'absent'; if (e.deleted) return 'supprime'; if (e.value === ${JSON.stringify(before[k])}) return 'identique'; const all = await new Promise((res) => { const o = indexedDB.open('podmix-kv'); o.onsuccess = () => { const g = o.result.transaction('kv').objectStore('kv').getAll(); g.onsuccess = () => { o.result.close(); res(g.result) } } }); const rec = all.some((x) => x.key.startsWith('podmix-recovered:' + ${JSON.stringify(k)}) && x.value === ${JSON.stringify(before[k])}); if (rec) return 'ancienne valeur gardee dans recovered (valeur courante differente)'; try { const bv = JSON.parse(${JSON.stringify(before[k])}); const nv = JSON.parse(e.value); if (Array.isArray(bv) && Array.isArray(nv)) { const ns = new Set(nv.map((x) => JSON.stringify(x))); if (bv.every((x) => ns.has(JSON.stringify(x)))) return 'CONSERVE-ET-COMPLETE avant=' + bv.length + ' maintenant=' + nv.length + ' ajoutes=' + nv.filter((x) => !bv.some((y) => JSON.stringify(y) === JSON.stringify(x))).map((x) => x.id ?? x.sessionId ?? '?').join(',') } } catch {} return 'DIFFERENT avant_longueur=' + ${JSON.stringify(before[k])}.length + ' maintenant_longueur=' + e.value.length + ' debut_avant=' + ${JSON.stringify(before[k])}.slice(0, 160) + ' debut_maintenant=' + e.value.slice(0, 160) })()`)
              if (r === 'identique') same++; else if (r.startsWith('CONSERVE-ET-COMPLETE')) { kept.push(k + '=' + r) } else diff.push(k + '=' + r)
            }
            log(phase + ': cles de la version precedente retrouvees identiques dans IndexedDB:', same, '/', Object.keys(before).length, 'ecarts:', diff.join(' ; ') || 'aucun', '| conserves et completes (modifies par l appli, rien de perdu):', kept.join(' ; ') || 'aucun')
            if (phase === 'migrated') {
            const cd = await ev(`(async () => { const e = await window.__idbGet('podmix-catalog-v1'); const bv = JSON.parse(${JSON.stringify(before['podmix-catalog-v1'])}); const nv = JSON.parse(e.value); const out = []; const walk = (a, b, p) => { if (JSON.stringify(a) === JSON.stringify(b)) return; if (a && b && typeof a === 'object' && typeof b === 'object') { for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) walk(a[k], b[k], p + '.' + k) } else out.push(p + ' : ' + JSON.stringify(a) + ' -> ' + JSON.stringify(b)) }; walk(bv, nv, ''); return out.join(' ## ') })()`)
            log('migrated: ecart catalogue champ par champ (donnees de test) :', cd)
          }
          log(phase + ': localStorage toujours present (non purge), filler:', await ev(`localStorage.getItem('zz-filler-0') !== null`), 'catalogue:', await ev(`localStorage.getItem('podmix-catalog-v1') !== null`))
            const body = String(await ev(`document.body.innerText.slice(0, 300).replace(/\\s+/g, ' ')`))
            log(phase + ': texte ecran:', body)
            log(phase + ': ecran Historique:', await ev(UIHIST))
            log(phase + ': ecran Favoris:', await ev(UIFAV))
            log(phase + ': erreur Quota affichee:', /QuotaExceeded|Failed to execute/.test(body))
          }
          if (phase === 'migrated') {
            await ev(`[...document.querySelectorAll('button')].find((b) => b.getAttribute('aria-label') === 'Réglages')?.click()`)
            await sleep(1500)
            const b4 = await ev(`(async () => (await window.__idbGet('podmix-settings-v1'))?.value ?? 'ABSENT')()`)
            await ev(`document.querySelectorAll('input[type=checkbox]')[0]?.click()`)
            await sleep(3000)
            const af = await ev(`(async () => (await window.__idbGet('podmix-settings-v1'))?.value ?? 'ABSENT')()`)
            log('reglage ecrit dans IndexedDB malgre localStorage sature:', b4 !== af && af !== 'ABSENT')
            fs.writeFileSync('out/settings-after.txt', String(af))
            log('bandeau:', String(await ev(`document.querySelector('.storage-warning')?.innerText ?? 'AUCUN'`)).replace(/\s+/g, ' '))
            log('estimation quota WebView:', await ev(`navigator.storage.estimate().then((e) => JSON.stringify(e))`))
            const big = await ev(`(async () => { const v = 'a'.repeat(52400000); const t0 = Date.now(); const ok = await new Promise((res) => { const o = indexedDB.open('podmix-kv'); o.onsuccess = () => { const tx = o.result.transaction('kv', 'readwrite'); tx.objectStore('kv').put({ key: 'zz-10x', value: v, at: new Date().toISOString() }); tx.oncomplete = () => res('ok'); tx.onerror = () => res('erreur ' + tx.error?.name); tx.onabort = () => res('abandon ' + tx.error?.name) } }); return ok + ' ms=' + (Date.now() - t0) })()`)
            log('ecriture 52,4 M caracteres (10x):', big)
            log('relecture 10x longueur:', await ev(`(async () => { const e = await window.__idbGet('zz-10x'); return e ? e.value.length : -1 })()`))
          }
          if (phase === 'after') {
            await ev(`document.querySelector('button[aria-label="Voir les favoris"]')?.click(); 1`)
            await sleep(3000)
            execSync('adb exec-out screencap -p > out/fav-229.png')
            log('after: largeur fenetre', await ev('window.innerWidth + "x" + window.innerHeight + " dpr=" + window.devicePixelRatio'))
            await ev(`document.querySelector('button[aria-label="Voir les favoris"]')?.click(); 1`)
            const sv = String(await ev(`(async () => (await window.__idbGet('podmix-settings-v1'))?.value ?? 'ABSENT')()`))
            log('reglage apres 2e kill/relance:', sv === fs.readFileSync('out/settings-after.txt', 'utf8') ? 'identique a celui ecrit' : 'DIFFERENT')
            log('10x apres kill/relance longueur:', await ev(`(async () => { const e = await window.__idbGet('zz-10x'); return e ? e.value.length : -1 })()`))
            execSync('adb exec-out screencap -p > out/durable-android.png')
          }
          if (phase === 'killapp') {
            // ecriture declenchee par le code de l appli (bascule d un reglage), kill immediat sans attendre la fin
            await ev(`[...document.querySelectorAll('button')].find((b) => b.getAttribute('aria-label') === 'Réglages')?.click()`)
            await sleep(1500)
            const s0 = await ev(`(async () => (await window.__idbGet('podmix-settings-v1'))?.value ?? 'ABSENT')()`)
            fs.writeFileSync('out/ks-before.txt', String(s0))
            const idx = Number(process.argv[4])
            send('Runtime.evaluate', { expression: `document.querySelectorAll('input[type=checkbox]')[${idx}]?.click()`, returnByValue: true })
            execSync(`adb shell am force-stop ${process.argv[3]}`)
            log('killapp: reglage ' + idx + ' bascule par le code appli puis kill immediat')
          }
          if (phase === 'killcheck') {
            const s1 = String(await ev(`(async () => (await window.__idbGet('podmix-settings-v1'))?.value ?? 'ABSENT')()`))
            let valid = false
            try { valid = typeof JSON.parse(s1) === 'object' } catch {}
            const s0 = fs.readFileSync('out/ks-before.txt', 'utf8')
            fs.writeFileSync('out/settings-after.txt', s1)
            log('killcheck: JSON valide:', valid)
            log('killcheck: issue de l ecriture acceptee puis tuee:', s1 === s0 ? 'ANCIENNE valeur (ecriture acceptee mais non confirmee, perdue)' : 'NOUVELLE valeur (ecriture confirmee avant le kill)')
            log('killcheck: catalogue intact:', await ev(`(async () => (await window.__idbGet('podmix-catalog-v1'))?.value?.includes('Podcast des favoris') === true)()`))
            log('killcheck: ecran Favoris:', await ev(UIFAV))
          }
          if (phase === 'killwrite') {
            // ecriture lourde dans IndexedDB, puis kill brutal sans attendre la fin de la transaction
            send('Runtime.evaluate', { expression: `(() => { const o = indexedDB.open('podmix-kv'); o.onsuccess = () => { const tx = o.result.transaction('kv', 'readwrite'); tx.objectStore('kv').put({ key: 'zz-kill', value: 'b'.repeat(80000000), at: 'x' }) }; return 1 })()`, returnByValue: true })
            await sleep(60)
            execSync(`adb shell am force-stop ${process.argv[3]}`)
            log('kill brutal envoye pendant une ecriture de 80 M caracteres')
          }
          if (phase === 'final') {
            const z = await ev(`(async () => { const e = await window.__idbGet('zz-kill'); return e ? 'COMPLET=' + (e.value.length === 80000000) + ' longueur=' + e.value.length : 'ABSENT' })()`)
            log('final: ecriture interrompue par le kill:', z, '(attendu : absente ou complete, jamais partielle)')
            const st = await ev(`(async () => (await window.__idbGet('podmix-settings-v1'))?.value ?? 'ABSENT')()`)
            log('final: reglage intact apres kill pendant ecriture:', String(st) === fs.readFileSync('out/settings-after.txt', 'utf8'))
            const cat = await ev(`(async () => (await window.__idbGet('podmix-catalog-v1'))?.value?.includes('Podcast des favoris') === true)()`)
            log('final: catalogue intact apres kill pendant ecriture:', cat)
            log('final: ecran Historique:', await ev(UIHIST))
            log('final: ecran Favoris:', await ev(UIFAV))
            log('final: erreur Quota affichee:', /QuotaExceeded|Failed to execute/.test(String(await ev(`document.body.innerText.slice(0, 300)`))))
            execSync('adb exec-out screencap -p > out/durable-android.png')
          }
          ws.close(); process.exit(0)
          PEOF
          cat > "$RUNNER_TEMP/run.sh" <<'XEOF'
          set -u
          PKG=$(cat out/pkg.txt)
          launch() {
            adb shell am start -n "$PKG/com.podmix.next.MainActivity" >/dev/null
            sleep 20
            PID=$(adb shell pidof "$PKG" | tr -d '\r')
            adb forward --remove-all || true
            adb forward tcp:9222 localabstract:webview_devtools_remote_$PID
          }
          : > out/res.txt
          adb install -r out/old.apk; adb logcat -c
          launch; echo "--- 1. ANCIENNE version (228) : donnees seed + localStorage sature" | tee -a out/res.txt
          node "$RUNNER_TEMP/p.mjs" seed 2>&1 | tee -a out/res.txt
          sleep 20; adb shell sync; adb shell am force-stop "$PKG"; sleep 3
          launch; echo "--- 2. ANCIENNE version : kill/relance, preuve de persistance AVANT mise a jour" | tee -a out/res.txt
          node "$RUNNER_TEMP/p.mjs" oldcheck 2>&1 | tee -a out/res.txt
          node "$RUNNER_TEMP/p.mjs" favadd 2>&1 | tee -a out/res.txt
          sleep 10; adb shell sync; adb shell am force-stop "$PKG"; sleep 3
          launch; echo "--- 2b. ANCIENNE version : kill/relance apres ajout d'un favori par l'UI" | tee -a out/res.txt
          node "$RUNNER_TEMP/p.mjs" oldfav 2>&1 | tee -a out/res.txt
          adb shell am force-stop "$PKG"; sleep 3
          echo "--- 3. mise a jour par-dessus (adb install -r, meme signature, donnees conservees)" | tee -a out/res.txt
          adb install -r out/new.apk 2>&1 | tee -a out/res.txt
          launch; echo "--- 4. NOUVELLE version, premier lancement apres mise a jour (migration)" | tee -a out/res.txt
          node "$RUNNER_TEMP/p.mjs" migrated 2>&1 | tee -a out/res.txt
          adb shell am force-stop "$PKG"; sleep 3
          launch; echo "--- 5. NOUVELLE version apres kill/relance" | tee -a out/res.txt
          node "$RUNNER_TEMP/p.mjs" after 2>&1 | tee -a out/res.txt
          echo "--- 5b. NOUVELLE version : detection YouTube reelle via serveur candidat local" | tee -a out/res.txt
          node "$RUNNER_TEMP/p.mjs" realyt 2>&1 | tee -a out/res.txt
          YT=$(node -e "const a=JSON.parse(require('fs').readFileSync('out/yt-href.txt','utf8')).filter(h=>!h.includes('detected-a'));console.log(a[0]||'')")
          if [ -n "$YT" ]; then echo "realyt: oEmbed HTTP $(curl -s -o out/oembed.json -w '%{http_code}' "https://www.youtube.com/oembed?url=${YT}&format=json") pour $YT" | tee -a out/res.txt; echo "realyt: titre oEmbed: $(head -c 200 out/oembed.json)" | tee -a out/res.txt; fi
          echo "serveur candidat, fin du journal:" | tee -a out/res.txt; tail -n 8 out/server.log | cut -c1-300 | tee -a out/res.txt
          for I in 0 1 2; do
            launch; echo "--- 6.$I NOUVELLE version : reglage bascule par le code appli puis kill immediat" | tee -a out/res.txt
            node "$RUNNER_TEMP/p.mjs" killapp "$PKG" $I 2>&1 | tee -a out/res.txt
            sleep 3
            launch; echo "--- 6.$I relance : controle" | tee -a out/res.txt
            node "$RUNNER_TEMP/p.mjs" killcheck 2>&1 | tee -a out/res.txt
            adb shell am force-stop "$PKG"; sleep 3
          done
          launch; echo "--- 6. NOUVELLE version : kill brutal pendant une grosse ecriture" | tee -a out/res.txt
          node "$RUNNER_TEMP/p.mjs" killwrite "$PKG" 2>&1 | tee -a out/res.txt
          sleep 3
          launch; echo "--- 7. NOUVELLE version : relance apres le kill pendant ecriture" | tee -a out/res.txt
          node "$RUNNER_TEMP/p.mjs" final 2>&1 | tee -a out/res.txt
          adb logcat -d | grep -c "FATAL EXCEPTION" > out/fatal.txt || true
          echo "FATAL EXCEPTION dans logcat: $(cat out/fatal.txt)" | tee -a out/res.txt
          { echo "## Stockage durable sur Android (emulateur jetable, APK debug, aucune publication)"; echo '```'; cat out/res.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "precondition filler persiste: true" out/res.txt || exit 1
          grep -q "precondition catalogue seed persiste: true" out/res.txt || exit 1
          grep -q "^migrated: ecart catalogue champ par champ" out/res.txt || exit 1
          # seuls ajouts admis : champ vide unseenEpisodeIds, et liens musicaux ajoutes par l'appli au 3e morceau (test) ; rien d'autre
          BAD=$(grep "^migrated: ecart catalogue champ par champ" out/res.txt | sed 's/^[^:]*: [^:]*) : //; s/ ## /\n/g' | grep -vE '^\.0\.unseenEpisodeIds : undefined -> \[\]$|^\.0\.episodes\.0\.tracks\.1\.[A-Za-z]+ : undefined -> ' || true)
          [ -z "$BAD" ] || { echo "ecart catalogue non admis: $BAD"; exit 1; }
          grep -E "^migrated: cles .* ecarts: podmix-catalog-v1=DIFFERENT" out/res.txt | grep -qv " ; podmix-" || exit 1
          grep -E "^after: cles .* ecarts: podmix-catalog-v1=DIFFERENT" out/res.txt | grep -qv " ; podmix-" || exit 1
          grep -qE "realyt: liens YouTube dans la vue Favoris: .*https://www\.youtube\.com/watch\?v=[A-Za-z0-9_-]{11}" out/res.txt || exit 1
          grep -q "realyt: oEmbed HTTP 200" out/res.txt || exit 1
          grep -q "erreur Quota affichee: false" out/res.txt || exit 1
          grep -q "ecrit dans IndexedDB malgre localStorage sature: true" out/res.txt || exit 1
          grep -q "relecture 10x longueur: 52400000" out/res.txt || exit 1
          grep -q "10x apres kill/relance longueur: 52400000" out/res.txt || exit 1
          grep -q "precondition historique visible dans l ecran Historique (ancienne version): HISTORIQUE-VISIBLE" out/res.txt || exit 1
          grep -q "migrated: ecran Historique: HISTORIQUE-VISIBLE" out/res.txt || exit 1
          grep -q "final: reglage intact apres kill pendant ecriture: true" out/res.txt || exit 1
          grep -q "final: catalogue intact apres kill pendant ecriture: true" out/res.txt || exit 1
          grep -qE "final: ecriture interrompue par le kill: (ABSENT|COMPLET=true)" out/res.txt || exit 1
          grep -q "favadd: FAVORI-AJOUTE" out/res.txt || exit 1
          grep -q "oldfav: ecran Favoris: .*FAVORIS-VISIBLES" out/res.txt || exit 1
          grep -q "migrated: ecran Favoris: .*FAVORIS-VISIBLES" out/res.txt || exit 1
          grep -q "after: ecran Favoris: .*FAVORIS-VISIBLES" out/res.txt || exit 1
          grep -q "final: ecran Favoris: .*FAVORIS-VISIBLES" out/res.txt || exit 1
          grep -q "migrated: ecran Favoris: .*detected-a" out/res.txt || exit 1
          [ "$(grep -c 'killcheck: JSON valide: true' out/res.txt)" = "3" ] || exit 1
          [ "$(grep -c 'killcheck: catalogue intact: true' out/res.txt)" = "3" ] || exit 1
          grep -q "reglage apres 2e kill/relance: identique" out/res.txt || exit 1
          [ "$(cat out/fatal.txt)" = "0" ] || exit 1
          XEOF
      - name: Serveur candidat local (code du depot, port 8099, aucune infrastructure de l'utilisateur)
        run: |
          mkdir -p out
          pip install --quiet -r server/requirements.txt
          PODMIX_ALLOWED_ORIGINS="https://localhost,http://localhost,capacitor://localhost" nohup python3 server/dev_server.py > out/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8099/health && break; sleep 1; done
          echo
      - name: Preparer l'emulateur accelere
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash ${{ runner.temp }}/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-android-durable
          path: out/*.png
      - name: Branche d'evidence (capture de l'emulateur, donnees de test fictives seulement)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ev"; cp out/*.png "$RUNNER_TEMP/ev/" || true
          git config user.name ci-evidence; git config user.email ci-evidence@example.invalid
          git checkout --orphan evidence-durable-android-20261026
          git rm -rf . -q
          cp "$RUNNER_TEMP"/ev/*.png . 
          git add *.png
          git commit -qm "capture emulateur (donnees de test fictives)"
          git push -f origin HEAD:evidence-durable-android-20261026
