openapi: 3.1.0
info:
  title: Podmix API
  version: 0.4.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service disponible
  /v1/shares:
    post:
      operationId: createSharePage
      description: Crée une page publique temporaire pour un passage déjà horodaté. Aucun média n'est téléversé, téléchargé ou relayé par cette opération.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceKind, sourceTitle, artist, trackTitle, sourceUrl, startSeconds]
              properties:
                sourceKind: { type: string, enum: [podcast, show, dj] }
                sourceTitle: { type: string, maxLength: 300 }
                episodeTitle: { type: string, maxLength: 300 }
                artist: { type: string, maxLength: 300 }
                trackTitle: { type: string, maxLength: 300 }
                sourceUrl: { type: string, format: uri }
                audioUrl: { type: string, format: uri }
                artworkUrl: { type: string, format: uri }
                spotifyUrl: { type: string, format: uri }
                deezerUrl: { type: string, format: uri }
                startSeconds: { type: number, minimum: 0 }
                endSeconds: { type: number, minimum: 0 }
      responses:
        "201": { description: Lien de partage créé }
        "400": { description: Métadonnées invalides }
        "429": { description: Limite de création atteinte }
  /v1/catalog/rss:
    post:
      operationId: importRssFeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                kind: { type: string, enum: [podcast, show], default: podcast }
                limit: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "201": { description: Flux RSS importé }
  /v1/catalog/podcasts:
    get:
      operationId: searchPodcasts
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Résultats de l’annuaire iTunes }
  /v1/catalog/radios:
    get:
      operationId: searchRadios
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Résultats Radio Browser }
  /v1/catalog/dj:
    get:
      operationId: searchDjSets
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: DJ sets publics trouvés }
    post:
      operationId: importDjSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        "201": { description: Métadonnées et flux audio temporaire résolus }
  /v1/episode-analysis:
    post:
      operationId: createEpisodeAnalysis
      description: Planifie la recherche RSS/Web puis, en dernier recours pour une tracklist musicale connue, le fallback audio techno/trance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [episodeId, title]
              properties:
                episodeId: { type: string }
                title: { type: string }
                description: { type: string }
                durationSeconds: { type: number, minimum: 0 }
                sourceUrl: { type: string, format: uri }
                audioUrl: { type: string, format: uri }
                sourceKind: { type: string, enum: [podcast, show, dj, radio] }
                musical: { type: boolean, default: false }
                enableExternalTracklists: { type: boolean, default: false }
                requestKey: { type: string }
                force: { type: boolean, default: false }
      responses:
        "202":
          description: Recherche durable acceptée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionJob"
  /v1/detection-jobs/{jobId}:
    get:
      operationId: getDetectionJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: État courant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionJob"
    delete:
      operationId: cancelDetectionJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job annulé
  /v1/detection-jobs/{jobId}/events:
    get:
      operationId: observeDetectionJob
      description: Flux SSE émettant des événements `job.updated`.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Flux text/event-stream
  /v1/detection-jobs/{jobId}/tracklist:
    post:
      operationId: alignTracklist
      description: Parse une tracklist textuelle et conserve uniquement les timestamps explicites.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200":
          description: Job contenant les titres proposés et leurs preuves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionJob"
  /v1/detection-jobs/{jobId}/discover:
    post:
      operationId: discoverTracklist
      description: Extrait les métadonnées d’une URL média autorisée puis aligne la tracklist trouvée.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        "200":
          description: Métadonnées et titres découverts
  /v1/detection-jobs/{jobId}/discover-1001:
    post:
      operationId: discover1001Tracklist
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                query: { type: string }
      responses:
        "200": { description: Tracklist 1001Tracklists alignée }
  /v1/detection-jobs/{jobId}/tracks/{trackId}/validate:
    post:
      operationId: validateCatalogTrack
      description: Recherche le titre et l’artiste dans MusicBrainz et ajoute cette preuve à la piste.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: trackId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Correspondances catalogue et piste enrichie
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    DetectionJob:
      type: object
      required: [id, episodeId, status, stage, progress, createdAt, updatedAt, tracks]
      properties:
        id: { type: string, format: uuid }
        episodeId: { type: string }
        status: { type: string, enum: [queued, running, web_pending, completed, failed, cancelled] }
        stage: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        error: { type: string }
    Track:
      type: object
      required: [id, time, artist, title, confidence, source]
      properties:
        id: { type: integer }
        time: { type: [number, "null"], minimum: 0 }
        artist: { type: string }
        title: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        source: { type: string, enum: [detected, manual] }
        verified: { type: boolean }
        evidence:
          type: array
          items: { type: string }
